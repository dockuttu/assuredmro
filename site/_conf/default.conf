# nginx config for assuredmro.com (mounted by docker-compose from site/_conf/default.conf)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # this config file itself is not public
    location ^~ /_conf/ { return 404; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2?)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /index.html;
}
