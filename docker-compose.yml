services:
  assuredmro:
    image: nginx:alpine
    container_name: assuredmro-site
    restart: always
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./site/_conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.assuredmro.rule=Host(`assuredmro.com`) || Host(`www.assuredmro.com`)"
      - "traefik.http.routers.assuredmro.entrypoints=web,websecure"
      - "traefik.http.routers.assuredmro.tls=true"
      - "traefik.http.routers.assuredmro.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.assuredmro.middlewares=amro-www-redirect"
      - "traefik.http.middlewares.amro-www-redirect.redirectregex.regex=^https?://www\\.assuredmro\\.com/(.*)"
      - "traefik.http.middlewares.amro-www-redirect.redirectregex.replacement=https://assuredmro.com/$${1}"
      - "traefik.http.middlewares.amro-www-redirect.redirectregex.permanent=true"
      - "traefik.http.services.assuredmro.loadbalancer.server.port=80"
networks:
  root_default:
    external: true
